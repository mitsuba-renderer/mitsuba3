name: Build Python wheels
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload wheels to PyPI? (0: no, 1: yes)'
        required: true
        default: '0'
      version_override:
        description: 'Value used to override the Mitsuba version (optional)'
        required: false
        default: ''

env:
  SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.event.inputs.version_override }}
  CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION

jobs:
  build_wheels:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14, macos-15-intel]
        python: [cp39, cp310, cp311, cp312, cp312_stable, cp313, cp314]
      fail-fast: false

    name: >
      ${{ matrix.python }} wheel for ${{ matrix.os }}
      ${{ (endsWith(matrix.python, '_stable') && '(stable ABI)') || '' }}
    runs-on: ${{ matrix.os }}

    steps:
      ###########################################################
      # Setup local environment (source code, build requirements)
      ###########################################################
      - uses: Wandalen/wretry.action@v1.2.0
        with:
          action: actions/checkout@v3
          with: |
            submodules: recursive
          attempt_limit: 3
          attempt_delay: 2000

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.11'

      - name: Install LLVM 18.1.8 on Windows
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: 18.1.8

      - name: Prepare compiler environment for Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Required for libjpeg-turbo
      - name: Install NASM on Windows
        if: runner.os == 'Windows'
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Install cibuildwheel
        run: |
          python -m pip install cibuildwheel==3.3.1


      ################################################################
      # Set up envvars to build the correct wheel (stable ABI or not)
      ################################################################
      - name: Prepare cibuildwheel environment (UNIX)
        if: ${{ ! endsWith(matrix.python, '_stable') && runner.os != 'Windows' }}
        run: |
          echo "CIBW_BUILD=${{ matrix.python }}-*" >> $GITHUB_ENV

      - name: Prepare cibuildwheel environment (Windows)
        if: ${{ ! endsWith(matrix.python, '_stable') && runner.os == 'Windows' }}
        run: |
          echo "CIBW_BUILD=${{ matrix.python }}-*" >> $env:GITHUB_ENV
          echo "CIBW_CONFIG_SETTINGS=cmake.args=''" >> $env:GITHUB_ENV

      - name: Prepare cibuildwheel environment for stable ABI wheel (UNIX)
        if: ${{ endsWith(matrix.python, '_stable') && runner.os != 'Windows' }}
        run: |
          stable_cp=$(echo ${{ matrix.python }} | cut -d_ -f1)
          echo "CIBW_BUILD=${stable_cp}-*" >> $GITHUB_ENV
          echo "CIBW_ENVIRONMENT=SKBUILD_WHEEL_PY_API=cp312" >> $GITHUB_ENV
          echo "CIBW_BUILD_FRONTEND=pip; args: --no-build-isolation" >> $GITHUB_ENV
          echo "CIBW_BEFORE_BUILD=python {project}/.github/install_build_deps_abi3.py" >> $GITHUB_ENV
          echo "CIBW_BEFORE_TEST=python {project}/.github/install_build_deps_abi3.py --drjit-only" >> $GITHUB_ENV
          echo "CIBW_CONFIG_SETTINGS=\"cmake.args=-DDRJIT_STABLE_ABI=ON;-DMI_STABLE_ABI=ON\"" >> $GITHUB_ENV

      - name: Prepare cibuildwheel environment for stable ABI wheel (Windows)
        if: ${{ endsWith(matrix.python, '_stable') && runner.os == 'Windows' }}
        run: |
          $stable_cp = '${{ matrix.python }}' -split '_'
          echo "CIBW_BUILD=$($stable_cp[0])-*" >> $env:GITHUB_ENV
          echo "CIBW_ENVIRONMENT=SKBUILD_WHEEL_PY_API=cp312" >> $env:GITHUB_ENV
          echo "CIBW_BUILD_FRONTEND=pip; args: --no-build-isolation" >> $env:GITHUB_ENV
          echo "CIBW_BEFORE_BUILD=python {project}/.github/install_build_deps_abi3.py" >> $env:GITHUB_ENV
          echo "CIBW_BEFORE_TEST=python {project}/.github/install_build_deps_abi3.py --drjit-only" >> $env:GITHUB_ENV
          echo "CIBW_CONFIG_SETTINGS=cmake.args='-DDRJIT_STABLE_ABI=ON;-DMI_STABLE_ABI=ON'" >> $env:GITHUB_ENV


      #########################
      # Build and store wheels
      #########################
      - name: Cache cibuildwheel downloads (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pypa\cibuildwheel\Cache
          key: cibw-virtualenv-20.26.3

      - name: Cache cibuildwheel downloads (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/cibuildwheel
          key: cibw-virtualenv-20.26.3

      - name: Pre-download virtualenv for cibuildwheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cacheDir = "$env:LOCALAPPDATA\pypa\cibuildwheel\Cache"
          New-Item -ItemType Directory -Force -Path $cacheDir
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/pypa/get-virtualenv/20.26.3/public/virtualenv.pyz" `
            -OutFile "$cacheDir\virtualenv-20.26.3.pyz"

      - name: Pre-download virtualenv for cibuildwheel (macOS)
        if: runner.os == 'macOS'
        run: |
          cache_dir="$HOME/Library/Caches/cibuildwheel"
          mkdir -p "$cache_dir"
          curl -fsSL \
            "https://raw.githubusercontent.com/pypa/get-virtualenv/20.26.3/public/virtualenv.pyz" \
            -o "$cache_dir/virtualenv-20.26.3.pyz"

      - name: Build wheel
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    name: Upload wheels to PyPI
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.upload == '1' }}
    needs: [build_wheels]

    steps:
      #########################
      # Fetch and upload wheels
      #########################
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_PASSWORD }}
